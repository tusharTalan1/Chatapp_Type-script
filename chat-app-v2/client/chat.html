<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp v2 - Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="error-toast"></div>

  <div class="glass-panel chat-layout">
    <div class="sidebar">
      <div class="sidebar-profile" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <h2 id="current-user-display" style="font-size: 1.2rem; margin-bottom: 4px; color: #fff;"></h2>
      </div>
      <h3>Active Users</h3>
      <div id="global-room-item" class="user-item">
        # global-chat
      </div>

      <h3 style="margin-top: 24px;">Direct Messages</h3>
      <div id="users-list">
      </div>
    </div>
    
    <div class="chat-main">
      <div class="chat-header">
        <h2>ChatApp <span id="current-room-badge"></span></h2>
        <button id="logout-btn">Logout</button>
      </div>

      <div class="messages-container" id="messages-container"></div>

      <form class="message-input-container" id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off" maxlength="100">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp v2 - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="error-toast"></div>

  <div class="glass-panel" id="auth-panel">
    <div id="login-section">
      <h1>Welcome Back</h1>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required oninput="this.value = this.value.replace(/\\s/g, '')">
        <div class="password-container">
          <input type="password" id="login-password" placeholder="Password" required oninput="this.value = this.value.replace(/\\s/g, '')">
          <span class="toggle-visibility">
            <svg class="eye-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </span>
        </div>
        <button type="submit">Login</button>
      </form>
      <div class="toggle-link" id="go-to-register">Don't have an account? Sign up</div>
    </div>

    <div id="register-section" class="hidden">
      <h1>Create Account</h1>
      <form id="register-form">
        <input type="text" id="reg-username" placeholder="Username" required>
        <input type="email" id="reg-email" placeholder="Email" required oninput="this.value = this.value.replace(/\\s/g, '')">
        <div class="password-container">
          <input type="password" id="reg-password" placeholder="Password" required pattern="(?=.*\\d)(?=.*[a-z])(?=.*[A-Z])\\S{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters (no spaces allowed)" oninput="this.value = this.value.replace(/\\s/g, '')">
          <span class="toggle-visibility">
            <svg class="eye-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </span>
        </div>
        <button type="submit">Register</button>
      </form>
      <div class="toggle-link" id="go-to-login">Already have an account? Login</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
